name: Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4, 8.5 ]
        laravel: [ 10.*, 11.*, 12.*, 13.* ]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
          - php: 8.1
            laravel: 10.*
            testbench: 8.*
        exclude:
          - php: 8.2
            laravel: 13.*
          - php: 8.5
            laravel: 10.*

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check renderer
        run: pnpm run typecheck

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none
          tools: composer:v2

      # Laravel 10 and 11 are end-of-life and every release has open advisories,
      # which Composer refuses to install. Allowed here only to test compatibility.
      - name: Allow end-of-life Laravel versions
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        run: |
          composer config policy.advisories.block false 2>/dev/null || composer config audit.block-insecure false
          echo "COMPOSER_NO_SECURITY_BLOCKING=1" >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest
